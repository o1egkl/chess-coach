name: Build Android APK, Windows (.exe) & GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Force recreate GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java / JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Set up Gradle & Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 📜 Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: ⚡ Build Web Application (Vite + TypeScript)
        run: npm run build

      - name: 🔧 Fix Line Endings and Permissions for Gradle Wrapper
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: 📁 Ensure Android Assets Directory Exists
        run: mkdir -p android/app/src/main/assets/public

      - name: 🔄 Copy Web Assets to Android
        run: npx cap copy android

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android --inline || true

      - name: 🔨 Compile Android APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📋 Prepare APK Output Artifacts
        id: prep
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          
          mkdir -p build-artifacts
          SOURCE_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          
          if [ -f "$SOURCE_APK" ]; then
            cp "$SOURCE_APK" "build-artifacts/chess-coach-v${VERSION}-${SHORT_SHA}.apk"
            cp "$SOURCE_APK" "build-artifacts/chess-coach-latest.apk"
            echo "✅ Successfully generated and copied APK artifacts:"
            ls -lh build-artifacts/
          else
            echo "❌ Error: APK not found at $SOURCE_APK"
            exit 1
          fi

      - name: 📤 Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chess-coach-android-apk
          path: build-artifacts/*.apk
          retention-days: 30

  build-windows:
    name: 💻 Build Windows Desktop (.exe)
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: ⚡ Package Electron Windows (.exe)
        run: npm run electron:build

      - name: 📋 Prepare Windows Executable Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-artifacts
          Copy-Item "dist-electron/Chess Coach Setup *.exe" "build-artifacts/Chess-Coach-Setup-latest.exe"
          Copy-Item "dist-electron/Chess Coach *.exe" "build-artifacts/Chess-Coach-Portable-latest.exe"
          Get-ChildItem -Path build-artifacts

      - name: 📤 Upload Windows EXEs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chess-coach-windows-exe
          path: build-artifacts/*.exe
          retention-days: 30

  publish-release:
    name: 🚀 Publish Unified Release
    needs: [build-android, build-windows]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: chess-coach-android-apk
          path: release-assets

      - name: 📥 Download Windows EXE Artifact
        uses: actions/download-artifact@v4
        with:
          name: chess-coach-windows-exe
          path: release-assets

      - name: 📋 List Release Assets
        run: ls -lh release-assets/

      - name: 🚀 Publish / Update "latest" Rolling Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 'Chess Coach — Android APK & Windows Desktop (.exe)'
          body: |
            ## ♟️ Chess Coach — Официальные сборки приложения

            Этот релиз автоматически собирается и обновляется через **GitHub Actions** при каждом пуше в ветку `main`.

            - **Коммит:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - **Движок:** Встроенный Stockfish 16 WASM (**100% офлайн**)
            - **Дата сборки:** ${{ github.event.head_commit.timestamp || 'Только что' }}

            ---

            ### 📱 Для Android:
            - **[`chess-coach-latest.apk`](https://github.com/${{ github.repository }}/releases/download/latest/chess-coach-latest.apk)** — прямая ссылка на скачивание APK.

            ### 💻 Для Windows:
            - **[`Chess-Coach-Portable-latest.exe`](https://github.com/${{ github.repository }}/releases/download/latest/Chess-Coach-Portable-latest.exe)** — портативная версия (не требует установки, запустил и играй).
            - **[`Chess-Coach-Setup-latest.exe`](https://github.com/${{ github.repository }}/releases/download/latest/Chess-Coach-Setup-latest.exe)** — стандартный установщик с ярлыком на рабочий стол.
          files: release-assets/*
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
